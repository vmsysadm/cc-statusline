[package]
name = "cc-statusline"
version = "0.1.0"
edition = "2021"
description = "A responsive, high-performance status line for Claude Code"
license = "MIT"

[dependencies]
memchr = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
